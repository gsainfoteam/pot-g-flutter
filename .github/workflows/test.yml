name: build test (android, iOS)

on:
  pull_request:
    branches:
      - development

jobs:
  check-test-required:
    name: Check if test is required
    runs-on: ubuntu-latest
    outputs:
      android-changed: ${{ steps.android-changed-files.outputs.any_changed }}
      ios-changed: ${{ steps.ios-changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed Files (android)
        uses: tj-actions/changed-files@v46
        id: android-changed-files
        with:
          files: |
            pubspec.yaml
            pubspec.lock
            android/**
            lib/**

      - name: Changed Files (iOS)
        uses: tj-actions/changed-files@v46
        id: ios-changed-files
        with:
          files: |
            pubspec.yaml
            pubspec.lock
            ios/**
            lib/**

  build-and-test:
    name: Build ${{ matrix.os }} App and Test
    needs: check-test-required
    strategy:
      fail-fast: false
      matrix:
        build-os: [ubuntu-latest, macos-26]
        include:
          - build-os: ubuntu-latest
            os: Android
          - build-os: macos-26
            os: iOS
    runs-on: ${{ matrix.build-os }}
    concurrency:
      group: ${{ matrix.os }}-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: setup env
        run: |
          echo "run=${{
              matrix.os == 'Android' && needs.check-test-required.outputs.android-changed == 'true' ||
              matrix.os == 'iOS' && needs.check-test-required.outputs.ios-changed == 'true'
            }}" >> $GITHUB_ENV
          echo "directory=$(echo ${{ matrix.os }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        if: env.run == 'true'
      - uses: subosito/flutter-action@v2
        if: env.run == 'true'
        with:
          flutter-version: "3.50.0"
          channel: "stable"
          cache: true
      - name: install flutterfire
        if: env.run == 'true'
        run: flutter pub global activate flutterfire_cli
      - uses: actions/setup-java@v4
        if: env.run == 'true' && matrix.os == 'Android'
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - uses: ruby/setup-ruby@v1
        if: env.run == 'true'
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: ${{ env.directory }}

      - name: Copy dotenv
        if: env.run == 'true'
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo 'IDP_CLIENT_ID=dummy_idp_client_id' > .env
            echo "AMPLITUDE_API_KEY=dummy_key_for_fork" >> .env
          else
            echo '${{ vars.DOTENV }}' > .env
            echo "AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }}" >> .env
          fi

      - uses: actions/cache@v4
        if: env.run == 'true'
        with:
          path: |
            .dart_tool/build
            lib/**/*.g.dart
            !lib/app/values/config.g.dart
            lib/**/*.freezed.dart
            lib/**/*.gr.dart
            lib/**/*.config.dart
            lib/gen
          # .env is an input of envied (config.g.dart) that build_runner does not track,
          # so it must be part of the key and of the restore prefix.
          key: codegen-${{ runner.os }}-3.50.0-${{ hashFiles('.env') }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'build.yaml', 'slang.yaml', 'assets/**', 'lib/**/*.dart') }}
          restore-keys: codegen-${{ runner.os }}-3.50.0-${{ hashFiles('.env') }}-
      - name: Generate files
        if: env.run == 'true'
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs
      - name: Run fastlane
        if: env.run == 'true'
        run: bundle exec fastlane test
        working-directory: ${{ env.directory }}
